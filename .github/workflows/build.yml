name: Build Custom Frida

on:
  workflow_call:
    inputs:
      frida_version:
        description: Frida version
        required: false
        type: string
        default: "16.2.1"
      custom_name:
        description: Replacement for the internal Frida name
        required: false
        type: string
        default: ajeossida
      arch:
        description: Comma-separated target architectures
        required: false
        type: string
        default: android-arm64
      port:
        description: Custom port; empty keeps the upstream default
        required: false
        type: string
        default: ""
      extended:
        description: Apply extended anti-detection patches
        required: false
        type: boolean
        default: true
      temp_fixes:
        description: Apply optional temporary stability fixes
        required: false
        type: boolean
        default: false
      strict_wx:
        description: Harden Frida-owned persistent anonymous RWX mappings on Android
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      frida_version:
        description: Frida version
        required: true
        type: string
        default: "16.2.1"
      custom_name:
        description: Replacement for the internal Frida name
        required: true
        type: string
        default: ajeossida
      arch:
        description: Target architecture(s)
        required: true
        type: choice
        default: android-arm64
        options:
          - android-arm64
          - android-arm
          - android-arm64,android-arm
          - android-arm64,android-arm,android-x86_64,android-x86
      port:
        description: Custom port; empty keeps the upstream default
        required: false
        type: string
        default: "12345"
      extended:
        description: Apply extended anti-detection patches
        required: false
        type: boolean
        default: true
      temp_fixes:
        description: Apply optional temporary stability fixes
        required: false
        type: boolean
        default: false
      strict_wx:
        description: Harden Frida-owned persistent anonymous RWX mappings on Android
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      ARCHITECTURES: ${{ inputs.arch }}
      CUSTOM_NAME: ${{ inputs.custom_name }}
      CUSTOM_PORT: ${{ inputs.port }}
      EXTENDED_PATCHES: ${{ inputs.extended }}
      FRIDA_VERSION: ${{ inputs.frida_version }}
      NDK_ARCHIVE_URL: https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
      STRICT_WX: ${{ inputs.strict_wx }}
      TEMPORARY_FIXES: ${{ inputs.temp_fixes }}

    steps:
      - name: Check out builder
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl git unzip python3-pip ninja-build
          pip install lief requests

      - name: Restore immutable NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: build/android-ndk-r25c
          key: android-ndk-r25c-linux

      - name: Download NDK r25c
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          archive="$RUNNER_TEMP/android-ndk-r25c-linux.zip"
          mkdir -p build
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$archive" "$NDK_ARCHIVE_URL"
          unzip -q "$archive" -d build

      - name: Patch build.py for Frida <= 16.3 Directory Compatibility
        run: |
          python3 - << 'EOF'
          with open("build.py", "r", encoding="utf-8") as f:
              content = f.read()

          # git clone 직후 subprojects 심볼릭 링크를 생성하도록 주입
          symlink_code = '''
              # Fix directory layout for older Frida versions
              subprojects_dir = os.path.join(work_dir, "frida", "subprojects")
              os.makedirs(subprojects_dir, exist_ok=True)
              for sub in ["frida-core", "frida-gum", "frida-clr", "frida-node", "frida-python", "frida-qml", "frida-swift", "frida-tools"]:
                  src = os.path.join(work_dir, "frida", sub)
                  dst = os.path.join(subprojects_dir, sub)
                  if os.path.exists(src) and not os.path.exists(dst):
                      os.symlink(src, dst)
          '''

          if "def clone_frida" in content:
              content = content.replace('return True', symlink_code + '\n    return True')
          elif "git clone" in content:
              # Fallback injection
              content = content.replace('print("[OK] Frida",', symlink_code + '\n    print("[OK] Frida",')

          with open("build.py", "w", encoding="utf-8") as f:
              f.write(content)
          EOF

      - name: Apply patches and build
        run: |
          command=(
            python3 build.py
            --version "$FRIDA_VERSION"
            --name "$CUSTOM_NAME"
            --arch "$ARCHITECTURES"
            --ndk-path build/android-ndk-r25c
            --verify
          )

          if [[ -n "$CUSTOM_PORT" ]]; then
            command+=(--port "$CUSTOM_PORT")
          fi
          if [[ "$EXTENDED_PATCHES" == "true" ]]; then
            command+=(--extended)
          fi
          if [[ "$TEMPORARY_FIXES" == "true" ]]; then
            command+=(--temp-fixes)
          fi
          if [[ "$STRICT_WX" == "true" ]]; then
            command+=(--strict-wx)
          fi

          printf 'Running:'
          printf ' %q' "${command[@]}"
          printf '\n'
          "${command[@]}"

      - name: Verify release assets
        run: |
          python3 -m json.tool output/build-info.json > /dev/null || true
          cd output
          sha256sum --check SHA256SUMS || true

      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: phantom-frida-16.2.1-arm64
          path: output/
          if-no-files-found: error
          retention-days: 30
